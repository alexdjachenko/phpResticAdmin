# Глобальный ServerName: подавляет AH00558 (без него Apache пытается
# вычислить FQDN из hostname контейнера). Значение не влияет на работу
# приложения (ссылки и редиректы относительные), важно лишь чтобы оно было
# задано и стабильно.
ServerName phpresticadmin

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
