# ================================================================
# TEST — все виды тестирования PHP-приложения
# Запускается на каждый push в main и на каждый PR
# ================================================================

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------
  # ЗАДАЧА 1: Линтинг PHP-кода (проверка синтаксиса)
  # --------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v4

      # Устанавливаем PHP версии 8.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Устанавливаем зависимости Composer (без лишнего вывода)
      - name: Install dependencies
        run: composer install --no-progress

      # Запускаем проверку синтаксиса всех .php-файлов (исключая vendor)
      - name: PHP Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  # --------------------------------------------------------------
  # ЗАДАЧА 2: Статический анализ (PHPStan)
  # --------------------------------------------------------------
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install dependencies
        run: composer install --no-progress
      # Запускаем PHPStan с конфигурацией phpstan.neon
      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

  # --------------------------------------------------------------
  # ЗАДАЧА 3: Модульные (юнит) тесты PHPUnit
  # --------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install dependencies
        run: composer install --no-progress
      # tsp нужен для юнит-тестов TspClient/TspCommandRunner (реальные вызовы task-spooler)
      - name: Install tsp
        run: sudo apt-get update && sudo apt-get install -y task-spooler
      # Запускаем тестовый набор "unit" из конфигурации phpunit.xml
      - name: PHPUnit Unit Tests
        run: vendor/bin/phpunit -c phpunit.xml --testsuite unit --colors=always

  # --------------------------------------------------------------
  # ЗАДАЧА 4: Интеграционные тесты (с реальным Docker-контейнером)
  # --------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Устанавливаем утилиту restic (для бэкапов, используется в интеграционных тестах)
      - name: Install restic
        run: |
          RESTIC_VERSION=0.19.1
          curl -L https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2 \
            | bzip2 -d > /usr/local/bin/restic
          chmod +x /usr/local/bin/restic
          restic version

      # Устанавливаем PHP-зависимости
      - name: Install dependencies
        run: composer install --no-progress

      # tsp нужен на хосте для интеграционных тестов, обращающихся к tsp напрямую
      - name: Install tsp
        run: sudo apt-get update && sudo apt-get install -y task-spooler

      # Собираем Docker-образ из Dockerfile для интеграционных тестов
      - name: Build Docker image
        run: docker build -t phpresticadmin:test -f docker/Dockerfile .

      # Запускаем контейнер в фоновом режиме на порту 8080
      - name: Start container
        run: docker run -d -p 8080:80 --name phpresticadmin-test phpresticadmin:test

      # Ждём, пока веб-сервер запустится (проверяем через curl)
      - name: Wait for web server
        run: |
          sleep 3
          for i in 1 2 3 4 5; do
            curl -s http://localhost:8080 && break
            sleep 2
          done

      # Запускаем интеграционные тесты PHPUnit (набор "integration")
      - name: PHPUnit Integration Tests
        run: vendor/bin/phpunit -c phpunit.xml --testsuite integration --colors=always

      # Очистка: останавливаем и удаляем контейнер (всегда, даже при ошибке)
      - name: Cleanup
        if: always()
        run: docker stop phpresticadmin-test && docker rm phpresticadmin-test