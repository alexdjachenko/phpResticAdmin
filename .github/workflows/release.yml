# ================================================================
# RELEASE — запуск release-please и добавление релизных тегов
# Запускается ТОЛЬКО после успешного прохождения тестов (workflow_run)
# ================================================================

name: Release

on:
  workflow_run:
    workflows: ["Test"]          # Имя workflow с тестами (должно совпадать с name: Test)
    types:
      - completed                # Срабатывает, когда Test завершён
    branches:
      - main                     # Только для ветки main

permissions:
  contents: write        # для release-please (создание коммитов, тегов, PR)
  pull-requests: write   # для release-please (создание PR)
  packages: write        # для добавления тегов в GHCR

jobs:
  release:
    # Запускаем только если тесты прошли успешно
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Клонируем репозиторий на тот же коммит, на котором запускались тесты
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Шаг 2: Запускаем release-please (анализирует коммиты, создаёт/обновляет релизный PR или завершает релиз)
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 4: Скачиваем протестированный образ по ПРАВИЛЬНОМУ SHA и пушим теги
      - name: Tag and Push Release Images
        # Запускаем, только на втором этапе, когда уже мерджим PR на релиз
        if: steps.release.outputs.release_created == 'true'
        env:
          # Гарантированно берем SHA коммита, из которого собирался образ
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Обрезаем SHA до 7 символов, так как сборщик Docker тегирует короткий хэш (sha-f35adaf)
          SHORT_SHA=$(echo "${{ env.TARGET_SHA }}" | cut -c1-7)
          echo "Скачиваем базовый образ с тегом: sha-$SHORT_SHA"
          
          # Скачиваем ранее собранный образ
          docker pull ghcr.io/alexdjachenko/phpresticadmin:sha-$SHORT_SHA
          
          # 1. Всегда обновляем тег latest в ветке main
          docker tag ghcr.io/alexdjachenko/phpresticadmin:sha-$SHORT_SHA ghcr.io/alexdjachenko/phpresticadmin:latest
          docker push ghcr.io/alexdjachenko/phpresticadmin:latest
          
          # 2. Если release-please зафиксировал создание нового релиза, вешаем тег версии
          if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
            VERSION_TAG="${{ steps.release.outputs.tag_name }}"
            echo "Обнаружен новый релиз: $VERSION_TAG. Создаем тег версии..."
            
            docker tag ghcr.io/alexdjachenko/phpresticadmin:sha-$SHORT_SHA ghcr.io/alexdjachenko/phpresticadmin:$VERSION_TAG
            docker push ghcr.io/alexdjachenko/phpresticadmin:$VERSION_TAG
          else
            echo "Это обычный коммит или служебный PR от release-please, тег версии не требуется."
          fi
