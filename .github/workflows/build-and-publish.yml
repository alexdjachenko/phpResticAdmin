# ================================================================
# BUILD — сборка Docker-образа для разработки (параллельно с тестами)
# Запускается на каждый push в main и на каждый PR
# ================================================================

name: Build

# ================================================================
# ТРИГГЕРЫ (СОБЫТИЯ) ЗАПУСКА
# ================================================================
on:
  # 1. Запуск при пуше в ветку main (обычные коммиты)
  push:
    branches: [main]

  # 2. Запуск при создании или обновлении Pull Request в main
  pull_request:
    branches: [main]



  # 3. Ручной запуск через интерфейс GitHub (кнопка "Run workflow")
  workflow_dispatch:

# ================================================================
# РАЗРЕШЕНИЯ (permissions) ДЛЯ ДЖОБОВ
# ================================================================
permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - uses: actions/checkout@v4

      # Шаг 2: Генерация метаданных (тегов) для Docker-образа
      - name: Docker meta (dev tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Всегда добавляем тег на основе SHA коммита (например, sha-a1b2c3d)
            type=sha,prefix=sha-
            # Для PR добавляем тег pr-XXX (только если событие pull_request)
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      # Шаг 3: Настройка Buildx для сборки многоплатформенных образов
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 4: Аутентификация в GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Используем стандартный GITHUB_TOKEN – он имеет доступ к пакетам
          # в этом же репозитории (так как мы дали permission packages: write)
          password: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 5: Сборка и публикация образа с тегами из метаданных
      - name: Build and push (dev image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэширование для ускорения сборки (используем кэш GitHub Actions)
          cache-from: type=gha
          cache-to: type=gha,mode=max