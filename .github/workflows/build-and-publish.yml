name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build-and-publish:
    runs-on: ubuntu-latest

    # ХИТРОСТЬ ТУТ: Если это пуш в main, мы принудительно заставляем джобу 
    # подождать, пока завершится release-please и создаст тег на сервере.
    # Если это Pull Request, она запустится сразу же (так как для PR джоба release-please пропускается)
    needs: [release-please]
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Скачивает всю историю коммитов
          fetch-tags: true  # Принудительно скачивает все Git-теги с сервера

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # flavor автоматически управляет тегом latest
          flavor: |
            latest=auto
          tags: |
            # 1. Спрашиваем у локального Git, привязан ли к текущему коммиту какой-то тег.
            # Если тег есть (например, v1.2.3), экшен подставит его сюда и сделает основным + создаст latest.
            # Если тегов нет (обычный коммит или PR), эта строчка просто безопасно проигнорируется.
            type=raw,value={{tag}},enable=${{ github.event_name == 'push' }}
            
            # 2. Ваши стандартные правила семантического версионирования (сработают, если на шаге 1 нашелся тег)
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            
            # 3. Если это коммит в main или PR, всегда собирается sha-xxxxxx для отладки
            type=sha,prefix=sha-
            
            # 4. Если это Pull Request, соберется тег pr-XXX (ваша отладка)
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
