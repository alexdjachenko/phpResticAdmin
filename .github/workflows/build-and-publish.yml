name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ШАГ 1: Объявляем выходы из джобы, чтобы их увидела сборка Docker
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build-and-publish:
    runs-on: ubuntu-latest
    # ШАГ 2: Связываем джобы через needs, чтобы Docker мог прочитать переменные из release-please
    needs: release-please
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # flavor автоматически управляет тегом latest
          flavor: |
            latest=auto
          tags: |
            # 1. Если release-please только что создал релиз, берем теги прямо из его результатов!
            type=raw,value=latest,enable=${{ needs.release-please.outputs.releases_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.releases_created == 'true' }}
            type=raw,value=v${{ needs.release-please.outputs.major }},enable=${{ needs.release-please.outputs.releases_created == 'true' }}
            type=raw,value=v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ needs.release-please.outputs.releases_created == 'true' }}
            
            # 2. Ваши стандартные отладочные сборки (на каждый пуш в main собирается sha)
            type=sha,prefix=sha-
            
            # 3. Ваша отладка в Pull Request
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
